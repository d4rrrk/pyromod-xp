services:
  xp-bot:
    build: .
    container_name: pyromod-xp
    restart: always
    env_file:
      - .env
    volumes:
      # This maps the folder on your Pi to the folder in the container
      -  /app/node_modules
      - ./:/app/
      # Pin the live XP/levels database outside the runner workspace so deploys never reset it
      - /home/d4rk/xp-pyromod/userData:/app/userData
    command: npx tsx watch src/index.ts